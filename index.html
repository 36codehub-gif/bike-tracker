<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Rider Tracker</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007bff">

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #map { height: 100vh; width: 100vw; }
    
    .panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      max-width: 320px;
      width: 90%;
    }
    
    h3 { font-size: 16px; margin-bottom: 8px; color: #111; border-bottom: 2px solid #007bff; padding-bottom: 4px; }
    label { font-size: 12px; font-weight: bold; color: #444; }
    select, button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button {
      background: #28a745;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    
    .stats-card {
      margin-top: 10px;
      background: #eef5ff;
      padding: 8px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
    }
    .status { margin-top: 6px; font-size: 12px; color: #007bff; font-weight: bold; }
  </style>
</head>
<body>

  <div class="panel">
    <h3>🚴 Multi-Rider Live Tracking</h3>
    
    <label for="riderSelect">Apna Naam Select Karein:</label>
    <select id="riderSelect" onchange="changeRider()">
      <option value="Ajay_Patel">Ajay Patel</option>
      <option value="Arvind_Kewat">Arvind Kewat</option>
      <option value="Baldev_Patel">Baldev Patel</option>
      <option value="Chaitan_Maitry">Chaitan Maitry</option>
      <option value="Sachin_Maitry">Sachin Maitry</option>
      <option value="Sanjay_Kumar">Sanjay Kumar</option>
      <option value="Shiv_Patel">Shiv Patel</option>
    </select>
    
    <button id="startBtn" onclick="startTracking()">GPS Live Tracking Start Karein</button>

    <div class="stats-card">
      <div>📊 Mera KM: <span id="totalDistance" style="color: #d9534f;">0.00 KM</span></div>
      <div>⚡ Meri Speed: <span id="currentSpeed">0 km/h</span></div>
    </div>

    <div class="status" id="status">Status: Ready</div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // PWA Service Worker Register
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log("PWA Service Worker Active"))
        .catch(err => console.log("SW Error:", err));
    }

    // Firebase Setup
    const firebaseConfig = {
      databaseURL: "https://full-stack-web-3ee1c-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Map Setup
    const map = L.map('map').setView([20.5937, 78.9629], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const markers = {};
    let currentRiderId = document.getElementById('riderSelect').value;
    let lastLat = null, lastLng = null, totalDistanceKm = 0;
    let initialMapCentered = false;

    function changeRider() {
      currentRiderId = document.getElementById('riderSelect').value;
    }

    // Distance Calculation (Haversine)
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    // 🟢 REALTIME MULTI-RIDER TRACKING ENGINE (Sabhi Riders Ko Ek Sath Dikhaye)
    db.ref("riders").on("value", (snapshot) => {
      const ridersData = snapshot.val();
      if (!ridersData) return;

      const allCoordinates = [];

      Object.keys(ridersData).forEach(riderId => {
        const data = ridersData[riderId];
        if (!data.lat || !data.lng) return;

        const riderName = riderId.replace('_', ' ');
        const popupText = `<b>👤 ${riderName}</b><br>📏 KM: ${data.distance || '0.00'} KM<br>⚡ Speed: ${data.speed || '0'} km/h`;

        allCoordinates.push([data.lat, data.lng]);

        // Marker Update Ya Create Karein
        if (markers[riderId]) {
          markers[riderId].setLatLng([data.lat, data.lng]);
          markers[riderId].setPopupContent(popupText);
        } else {
          markers[riderId] = L.marker([data.lat, data.lng])
            .addTo(map)
            .bindPopup(popupText);
        }
      });

      // Sabhi Active Riders Ko Map Par Zoom Out / In Karke Fit Karein
      if (allCoordinates.length > 0 && !initialMapCentered) {
        const bounds = L.latLngBounds(allCoordinates);
        map.fitBounds(bounds, { padding: [50, 50] });
        initialMapCentered = true;
      }
    });

    // Mobile GPS Live Sender
    function startTracking() {
      document.getElementById('status').innerText = "Status: Live Tracking Active🟢";
      document.getElementById('startBtn').innerText = "Tracking Chalu Hai...";
      document.getElementById('startBtn').style.background = "#007bff";

      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          (position) => {
            const { latitude, longitude, speed } = position.coords;
            const currentSpeedKmH = speed ? (speed * 3.6).toFixed(1) : "0";

            if (lastLat !== null && lastLng !== null) {
              const dist = calculateDistance(lastLat, lastLng, latitude, longitude);
              if (dist > 0.005) { // 5 meters se aage badhne par
                totalDistanceKm += dist;
                document.getElementById('totalDistance').innerText = `${totalDistanceKm.toFixed(2)} KM`;
              }
            }

            lastLat = latitude;
            lastLng = longitude;
            const formattedDist = totalDistanceKm.toFixed(2);
            document.getElementById('currentSpeed').innerText = `${currentSpeedKmH} km/h`;

            // Firebase me Apni Location Bhejein
            db.ref("riders/" + currentRiderId).set({
              lat: latitude,
              lng: longitude,
              speed: currentSpeedKmH,
              distance: formattedDist,
              updatedAt: Date.now()
            });
          },
          (err) => alert("GPS Permission Allow Karein!"),
          { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
        );
      } else {
        alert("Aapka Browser GPS Tracking Support Nahi Karta!");
      }
    }
  </script>
</body>
</html>
