<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Rider Tracker & Odometer</title>

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- PeerJS for Direct Connection -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #map { height: 100vh; width: 100vw; }
    
    .panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      max-width: 340px;
      width: 90%;
    }
    
    h3 { font-size: 18px; margin-bottom: 10px; color: #111; border-bottom: 2px solid #007bff; padding-bottom: 5px; }
    label { font-size: 13px; font-weight: bold; color: #444; }
    select, button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    select { background: #f9f9f9; }
    button {
      background: #28a745;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }
    button:active { background: #218838; }
    
    .stats-card {
      margin-top: 12px;
      background: #eef5ff;
      padding: 10px;
      border-radius: 8px;
      border-left: 4px solid #007bff;
    }
    .stats-item { font-size: 13px; font-weight: bold; color: #222; margin-bottom: 4px; }
    .status { margin-top: 8px; font-size: 12px; color: #555; }
    .online-tag { color: #28a745; font-weight: bold; }
  </style>
</head>
<body>

  <div class="panel">
    <h3>🚴 Live Route Rider Tracker</h3>
    
    <label for="riderSelect">Apna Naam Select Karein:</label>
    <select id="riderSelect" onchange="changeRider()">
      <option value="Ajay_Patel">Ajay Patel</option>
      <option value="Arvind_Kewat">Arvind Kewat</option>
      <option value="Baldev_Patel">Baldev Patel</option>
      <option value="Chaitan_Maitry">Chaitan Maitry</option>
      <option value="Sachin_Maitry">Sachin Maitry</option>
      <option value="Sanjay_Kumar">Sanjay Kumar</option>
      <option value="Shiv_Patel">Shiv Patel</option>
    </select>
    
    <button onclick="startTracking()">GPS Live Tracking Start Karein</button>

    <div class="stats-card">
      "[https://full-stack-web-3ee1c-default-rtdb.firebaseio.com/](https://full-stack-web-3ee1c-default-rtdb.firebaseio.com/)"
      <div class="stats-item">📊 Kitna KM Chale: <span id="totalDistance" style="color: #d9534f;">0.00 KM</span></div>
      <div class="stats-item">⚡ Current Speed: <span id="currentSpeed">0 km/h</span></div>
    </div>

    <div class="status" id="status">Status: Direct Peer Network Ready</div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize Map
    const map = L.map('map').setView([20.5937, 78.9629], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const ridersList = [
      "Ajay_Patel", "Arvind_Kewat", "Baldev_Patel", 
      "Chaitan_Maitry", "Sachin_Maitry", "Sanjay_Kumar", "Shiv_Patel"
    ];

    const markers = {};
    const connections = {};
    let currentRiderId = document.getElementById('riderSelect').value;
    let peer;
    
    // Odometer & Distance Variables
    let lastLat = null;
    let lastLng = null;
    let totalDistanceKm = 0;

    function changeRider() {
      currentRiderId = document.getElementById('riderSelect').value;
    }

    // Haversine Formula: KM Calculate karne ke liye
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Radius of Earth in KM
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c; 
    }

    // Direct P2P Network Initialize karna
    function initNetwork() {
      peer = new Peer(currentRiderId);

      peer.on('open', (id) => {
        const formattedName = id.replace('_', ' ');
        document.getElementById('status').innerHTML = `Status: <span class="online-tag">${formattedName} Online</span>`;
        connectToOtherRiders();
      });

      // Receiving Location Data from other riders
      peer.on('connection', (conn) => {
        conn.on('data', (data) => {
          updateRiderOnMap(data.riderId, data.lat, data.lng, data.distance, data.speed);
        });
      });
    }

    function connectToOtherRiders() {
      ridersList.forEach(rider => {
        if (rider !== currentRiderId) {
          const conn = peer.connect(rider);
          if (conn) {
            conn.on('open', () => {
              connections[rider] = conn;
            });
          }
        }
      });
    }

    // Map Par Rider Ke Marker Ko Update Karna
    function updateRiderOnMap(riderId, lat, lng, distance = 0, speed = 0) {
      const riderName = riderId.replace('_', ' ');
      const popupText = `<b>👤 ${riderName}</b><br>📏 KM: ${distance} KM<br>⚡ Speed: ${speed} km/h`;

      if (markers[riderId]) {
        markers[riderId].setLatLng([lat, lng]);
        markers[riderId].setPopupContent(popupText);
      } else {
        markers[riderId] = L.marker([lat, lng])
          .addTo(map)
          .bindPopup(popupText)
          .openPopup();
      }
    }

    // Prevent Screen Sleep (Background Execution Support)
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log('Wake Lock Error:', err.message);
      }
    }

    // GPS Tracking Function
    function startTracking() {
      initNetwork();
      requestWakeLock();

      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          (position) => {
            const { latitude, longitude, speed } = position.coords;

            // Speed KM/H में convert करें
            const currentSpeedKmH = speed ? (speed * 3.6).toFixed(1) : 0;
            document.getElementById('currentSpeed').innerText = `${currentSpeedKmH} km/h`;

            // Distance Calculation Logic
            if (lastLat !== null && lastLng !== null) {
              const distanceCovered = calculateDistance(lastLat, lastLng, latitude, longitude);
              // Filter out small GPS jumps (< 5 meters)
              if (distanceCovered > 0.005) {
                totalDistanceKm += distanceCovered;
                document.getElementById('totalDistance').innerText = `${totalDistanceKm.toFixed(2)} KM`;
              }
            }

            lastLat = latitude;
            lastLng = longitude;

            const formattedDistance = totalDistanceKm.toFixed(2);

            // Update Own Marker on Map
            updateRiderOnMap(currentRiderId, latitude, longitude, formattedDistance, currentSpeedKmH);
            map.setView([latitude, longitude], 15);

            // Send My Location & Distance to All Active Connections
            ridersList.forEach(rider => {
              if (connections[rider] && connections[rider].open) {
                connections[rider].send({
                  riderId: currentRiderId,
                  lat: latitude,
                  lng: longitude,
                  distance: formattedDistance,
                  speed: currentSpeedKmH
                });
              }
            });
          },
          (err) => alert("GPS Permission aur Location On karein! " + err.message),
          { 
            enableHighAccuracy: true, 
            maximumAge: 0, 
            timeout: 10000 
          }
        );
      } else {
        alert("Aapka Browser GPS Tracking Support Nahi Karta!");
      }
    }
  </script>
</body>
</html>
