<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Bike Route Tracker</title>

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- PeerJS for Direct Phone-to-Phone Realtime Sync -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    #map { height: 100vh; width: 100vw; }
    
    .panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      max-width: 320px;
      width: 90%;
    }
    
    h3 { font-size: 16px; margin-bottom: 8px; color: #111; }
    select, button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .status { margin-top: 8px; font-size: 12px; color: #555; font-weight: bold; }
    .online-tag { color: #28a745; }
  </style>
</head>
<body>

  <div class="panel">
    <h3>🚴 Bike Live Tracker</h3>
    <label>Meri Bike Select Karein:</label>
    <select id="bikeSelect" onchange="changeBike()">
      <option value="Bike-1">Bike 1 (Rider 1)</option>
      <option value="Bike-2">Bike 2 (Rider 2)</option>
      <option value="Bike-3">Bike 3 (Rider 3)</option>
      <option value="Bike-4">Bike 4 (Rider 4)</option>
    </select>
    
    <button onclick="startTracking()">GPS Live Tracking Chalu Karein</button>
    <div class="status" id="status">Status: Direct Peer Network Ready</div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize Leaflet Map
    const map = L.map('map').setView([20.5937, 78.9629], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const markers = {};
    let myBikeId = document.getElementById('bikeSelect').value;
    let peer;
    const allBikes = ["Bike-1", "Bike-2", "Bike-3", "Bike-4"];
    const connections = {};

    function changeBike() {
      myBikeId = document.getElementById('bikeSelect').value;
    }

    // Direct Mobile-to-Mobile Connection Engine
    function initNetwork() {
      peer = new Peer(myBikeId);

      peer.on('open', (id) => {
        document.getElementById('status').innerHTML = `Status: <span class="online-tag">${id} Online!</span>`;
        connectToOtherBikes();
      });

      // Receiving Location from other bikes
      peer.on('connection', (conn) => {
        conn.on('data', (data) => {
          updateBikeLocationOnMap(data.bikeId, data.lat, data.lng);
        });
      });
    }

    function connectToOtherBikes() {
      allBikes.forEach(bike => {
        if (bike !== myBikeId) {
          const conn = peer.connect(bike);
          if (conn) {
            conn.on('open', () => {
              connections[bike] = conn;
            });
          }
        }
      });
    }

    // Map Par Location Update Karna
    function updateBikeLocationOnMap(bikeId, lat, lng) {
      if (markers[bikeId]) {
        markers[bikeId].setLatLng([lat, lng]);
      } else {
        markers[bikeId] = L.marker([lat, lng])
          .addTo(map)
          .bindPopup(`<b>${bikeId}</b>`)
          .openPopup();
      }
    }

    // Start Mobile GPS Tracking
    function startTracking() {
      initNetwork();

      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          (position) => {
            const { latitude, longitude } = position.coords;
            
            // Map Par Apni Location Update Karein
            updateBikeLocationOnMap(myBikeId, latitude, longitude);
            map.setView([latitude, longitude], 15);

            // Dusre Riders Ko Apni Location Bhejein
            allBikes.forEach(bike => {
              if (connections[bike] && connections[bike].open) {
                connections[bike].send({
                  bikeId: myBikeId,
                  lat: latitude,
                  lng: longitude
                });
              }
            });
          },
          (err) => alert("GPS Permission zaroori hai! " + err.message),
          { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
        );
      } else {
        alert("Aapka Browser GPS support nahi karta.");
      }
    }
  </script>
</body>
</html>
