<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advance Multi-Rider Pro Tracker</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111827">

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #111827; color: #fff; }
    #map { height: 100vh; width: 100vw; z-index: 1; }
    
    .panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(17, 24, 39, 0.92);
      backdrop-filter: blur(8px);
      padding: 15px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      max-width: 330px;
      width: 90%;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    h3 { font-size: 16px; margin-bottom: 8px; color: #60a5fa; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
    label { font-size: 11px; font-weight: bold; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; }
    
    select, button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #374151;
      font-size: 13px;
      outline: none;
    }
    select { background: #1f2937; color: #fff; }
    
    .btn-start { background: #10b981; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-start:active { transform: scale(0.98); }
    .btn-focus { background: #3b82f6; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .btn-sos { background: #ef4444; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 8px; animation: pulse 1.5s infinite; }
    
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .stats-card { background: #1f2937; padding: 8px; border-radius: 8px; border: 1px solid #374151; }
    .stats-card div:first-child { font-size: 10px; color: #9ca3af; text-transform: uppercase; }
    .stats-card div:last-child { font-size: 14px; font-weight: bold; color: #f3f4f6; margin-top: 2px; }

    .status-bar { margin-top: 10px; font-size: 11px; color: #10b981; font-weight: bold; display: flex; align-items: center; gap: 6px; }
    
    /* Custom Popup Styling */
    .leaflet-popup-content-wrapper { background: #1f2937 !important; color: #fff !important; border-radius: 12px; border: 1px solid #374151; }
    .leaflet-popup-tip { background: #1f2937 !important; }
    
    /* SOS Banner */
    #sosAlertBanner {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      background: #ef4444;
      color: white;
      text-align: center;
      padding: 12px;
      font-weight: bold;
      z-index: 2000;
      font-size: 14px;
      box-shadow: 0 4px 15px rgba(239,68,68,0.5);
    }
  </style>
</head>
<body>

  <div id="sosAlertBanner">🚨 EMERGENCY SOS ALERT! <span id="sosRiderName"></span> ko Help Chahiye!</div>

  <div class="panel">
    <h3>🚴 Rider Pro Tracker <span id="themeToggle" style="cursor:pointer;" onclick="toggleDarkMap()">🌙</span></h3>
    
    <label for="riderSelect">Apna Naam Select Karein:</label>
    <select id="riderSelect" onchange="changeRider()">
      <option value="Ajay_Patel">Ajay Patel</option>
      <option value="Arvind_Kewat">Arvind Kewat</option>
      <option value="Baldev_Patel">Baldev Patel</option>
      <option value="Chaitan_Maitry">Chaitan Maitry</option>
      <option value="Sachin_Maitry">Sachin Maitry</option>
      <option value="Sanjay_Kumar">Sanjay Kumar</option>
      <option value="Shiv_Patel">Shiv Patel</option>
    </select>
    
    <button class="btn-start" id="startBtn" onclick="startTracking()">🟢 Live Tracking Start Karein</button>
    <button class="btn-focus" onclick="focusSelectedRider()">📍 Selected Rider Focus Karein</button>
    <button class="btn-sos" onclick="sendSOS()">🚨 Emergency SOS Bhejein</button>

    <div class="stats-grid">
      <div class="stats-card">
        <div>Total Distance</div>
        <div id="totalDistance" style="color:#60a5fa;">0.00 KM</div>
      </div>
      <div class="stats-card">
        <div>Live Speed</div>
        <div id="currentSpeed" style="color:#34d399;">0 km/h</div>
      </div>
    </div>

    <div class="status-bar" id="status">
      <span>●</span> <span id="statusText">System Ready</span>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log("SW Error:", err));
    }

    const firebaseConfig = {
      databaseURL: "https://full-stack-web-3ee1c-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Map Setup with Dark Mode Option
    let isDarkMap = true;
    const map = L.map('map').setView([20.5937, 78.9629], 5);
    
    let tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19
    }).addTo(map);

    function toggleDarkMap() {
      map.removeLayer(tileLayer);
      if (isDarkMap) {
        tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        document.getElementById('themeToggle').innerText = "☀️";
        isDarkMap = false;
      } else {
        tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        document.getElementById('themeToggle').innerText = "🌙";
        isDarkMap = true;
      }
    }

    // Color codes for 7 riders
    const riderColors = {
      "Ajay_Patel": "#ef4444",
      "Arvind_Kewat": "#3b82f6",
      "Baldev_Patel": "#10b981",
      "Chaitan_Maitry": "#f59e0b",
      "Sachin_Maitry": "#8b5cf6",
      "Sanjay_Kumar": "#ec4899",
      "Shiv_Patel": "#06b6d4"
    };

    const markers = {};
    const polylines = {};
    const routeHistories = {};
    let latestRiderData = {};
    let currentRiderId = document.getElementById('riderSelect').value;
    let lastLat = null, lastLng = null, totalDistanceKm = 0;

    function changeRider() {
      currentRiderId = document.getElementById('riderSelect').value;
      focusSelectedRider();
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function focusSelectedRider() {
      const selectedId = document.getElementById('riderSelect').value;
      if (latestRiderData[selectedId]) {
        const data = latestRiderData[selectedId];
        map.flyTo([data.lat, data.lng], 16, { animate: true, duration: 1.2 });
        if (markers[selectedId]) markers[selectedId].openPopup();
      }
    }

    function createCustomIcon(color) {
      return L.divIcon({
        className: 'custom-icon',
        html: `<div style="background-color:${color}; width:16px; height:16px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 10px ${color};"></div>`,
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });
    }

    // REALTIME DATABASE ENGINE
    db.ref("riders").on("value", (snapshot) => {
      const ridersData = snapshot.val();
      if (!ridersData) return;

      latestRiderData = ridersData;
      const currentTime = Date.now();

      Object.keys(ridersData).forEach(riderId => {
        const data = ridersData[riderId];
        if (!data.lat || !data.lng) return;

        const riderName = riderId.replace('_', ' ');
        const color = riderColors[riderId] || "#ffffff";
        
        // Online / Offline Check (30 sec rule)
        const isOnline = (currentTime - (data.updatedAt || 0)) < 30000;
        const statusBadge = isOnline ? '🟢 Online' : '🔴 Offline';

        const popupText = `
          <div style="font-size:12px;">
            <b style="color:${color}; font-size:14px;">🚴 ${riderName}</b><br>
            <span>Status: ${statusBadge}</span><br>
            <span>📏 KM: <b>${data.distance || '0.00'} KM</b></span><br>
            <span>⚡ Speed: <b>${data.speed || '0'} km/h</b></span>
          </div>`;

        // Route Trail Polyline Update
        if (!routeHistories[riderId]) routeHistories[riderId] = [];
        routeHistories[riderId].push([data.lat, data.lng]);

        if (polylines[riderId]) {
          polylines[riderId].setLatLngs(routeHistories[riderId]);
        } else {
          polylines[riderId] = L.polyline(routeHistories[riderId], { color: color, weight: 4, opacity: 0.7 }).addTo(map);
        }

        // Marker Update
        if (markers[riderId]) {
          markers[riderId].setLatLng([data.lat, data.lng]);
          markers[riderId].setPopupContent(popupText);
        } else {
          markers[riderId] = L.marker([data.lat, data.lng], { icon: createCustomIcon(color) })
            .addTo(map)
            .bindPopup(popupText);

          markers[riderId].on('click', () => {
            document.getElementById('riderSelect').value = riderId;
            currentRiderId = riderId;
            map.flyTo([data.lat, data.lng], 16, { animate: true });
          });
        }
      });
    });

    // LISTEN FOR SOS EMERGENCY ALERTS
    db.ref("sos_alert").on("value", (snapshot) => {
      const alertData = snapshot.val();
      if (alertData && alertData.active) {
        document.getElementById('sosAlertBanner').style.display = 'block';
        document.getElementById('sosRiderName').innerText = alertData.riderName;
        map.flyTo([alertData.lat, alertData.lng], 17, { animate: true });
      } else {
        document.getElementById('sosAlertBanner').style.display = 'none';
      }
    });

    function sendSOS() {
      if (lastLat && lastLng) {
        const riderName = currentRiderId.replace('_', ' ');
        db.ref("sos_alert").set({
          active: true,
          riderId: currentRiderId,
          riderName: riderName,
          lat: lastLat,
          lng: lastLng,
          time: Date.now()
        });
        alert("🚨 Emergency SOS Alert Bhej Diya Gaya Hai!");
      } else {
        alert("Pehle GPS Live Tracking Start Karein!");
      }
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
      } catch (err) {}
    }

    function startTracking() {
      requestWakeLock();
      document.getElementById('statusText').innerText = "Live Tracking Active🟢";
      document.getElementById('startBtn').innerText = "Tracking Chalu Hai...";
      document.getElementById('startBtn').style.background = "#3b82f6";

      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          (position) => {
            const { latitude, longitude, speed } = position.coords;
            const currentSpeedKmH = speed ? (speed * 3.6).toFixed(1) : "0";

            if (lastLat !== null && lastLng !== null) {
              const dist = calculateDistance(lastLat, lastLng, latitude, longitude);
              if (dist > 0.005) {
                totalDistanceKm += dist;
                document.getElementById('totalDistance').innerText = `${totalDistanceKm.toFixed(2)} KM`;
              }
            }

            lastLat = latitude;
            lastLng = longitude;
            const formattedDist = totalDistanceKm.toFixed(2);
            document.getElementById('currentSpeed').innerText = `${currentSpeedKmH} km/h`;

            db.ref("riders/" + currentRiderId).set({
              lat: latitude,
              lng: longitude,
              speed: currentSpeedKmH,
              distance: formattedDist,
              updatedAt: Date.now()
            });
          },
          (err) => alert("GPS Permission Allow Karein!"),
          { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
        );
      }
    }
  </script>
</body>
</html>
