<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Bike Trip Tracker</title>

  <!-- Leaflet Map CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <!-- Your CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       TRIP SETUP
  ========================== -->

  <section id="setupScreen" class="setup-screen">

    <div class="setup-card">

      <div class="logo">
        🏍️
      </div>

      <h1>Bike Trip</h1>

      <p class="setup-subtitle">
        Create your ride and start tracking
      </p>


      <!-- NAME -->

      <label for="riderName">
        Your Name
      </label>

      <input
        type="text"
        id="riderName"
        placeholder="Example: Amit"
        autocomplete="name"
      >


      <!-- STARTING LOCATION -->

      <label for="startLocation">
        Starting Location
      </label>

      <input
        type="text"
        id="startLocation"
        placeholder="Example: Raipur"
      >


      <!-- DESTINATION -->

      <label for="destination">
        Destination
      </label>

      <input
        type="text"
        id="destination"
        placeholder="Example: Kathmandu"
      >


      <button
        id="startTripBtn"
        class="start-trip-btn"
      >
        🚀 Start Trip
      </button>


      <button
        id="gpsSetupBtn"
        class="gps-btn"
      >
        📍 Use My Current Location
      </button>

    </div>

  </section>



  <!-- =========================
       MAIN APP
  ========================== -->

  <section
    id="appScreen"
    class="app-screen hidden"
  >

    <!-- HEADER -->

    <header class="header">

      <div>
        <h1>🇳🇵 Nepal Ride</h1>

        <p id="tripInfo">
          Live Trip
        </p>
      </div>

      <button
        id="profileBtn"
        class="profile-btn"
      >
        👤
      </button>

    </header>


    <!-- STATUS -->

    <div class="status-bar">

      <span class="online-dot"></span>

      <strong>
        <span id="riderCount">1</span>
        Riders Online
      </strong>

      <span class="updated">
        LIVE
      </span>

    </div>


    <!-- MAP -->

    <main>

      <section class="map-container">

        <div class="map-title">

          <span>
            🗺️ Live Map
          </span>

          <button id="locationBtn">
            📍 My Location
          </button>

        </div>


        <!-- REAL LEAFLET MAP -->

        <div
          id="map"
          class="real-map"
        ></div>

      </section>


      <!-- RIDERS -->

      <section class="riders-section">

        <div class="section-header">

          <h2>
            Riders
          </h2>

          <span>
            <span id="memberCount">1</span>
            Members
          </span>

        </div>


        <div
          id="riderList"
          class="rider-list"
        >

          <!-- Rider will be added by JavaScript -->

        </div>

      </section>

    </main>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

      <button
        class="nav-item active"
        id="mapNavBtn"
      >
        <span>🗺️</span>
        <small>Map</small>
      </button>


      <button
        class="nav-item"
        id="chatBtn"
      >
        <span>💬</span>
        <small>Chat</small>
      </button>


      <button
        class="nav-item"
        id="callBtn"
      >
        <span>📞</span>
        <small>Calls</small>
      </button>


      <button
        class="nav-item"
        id="ridersNavBtn"
      >
        <span>👥</span>
        <small>Riders</small>
      </button>

    </nav>

  </section>



  <!-- Leaflet JavaScript -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>


  <!-- Your JavaScript -->

  <script src="app.js"></script>

</body>

</html>
