
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nepal Ride Tracker</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Header -->
  <header class="header">
    <div>
      <h1>🇳🇵 Nepal Ride</h1>
      <p>8 Riders • Live Trip</p>
    </div>

    <button class="profile-btn">👤</button>
  </header>


  <!-- Online Status -->
  <div class="status-bar">
    <span class="online-dot"></span>
    <strong>8 Riders Online</strong>
    <span class="updated">Live</span>
  </div>


  <!-- Map -->
  <main>

    <section class="map-container">

      <div class="map-title">
        <span>🗺️ Live Map</span>
        <button id="locationBtn">📍 My Location</button>
      </div>

      <!-- Temporary map area -->
      <div class="map">

        <div class="road road-1"></div>
        <div class="road road-2"></div>

        <!-- Bikes -->
        <div class="bike bike-1" title="Amit">🏍️</div>
        <div class="bike bike-2" title="Rahul">🏍️</div>
        <div class="bike bike-3" title="Ravi">🏍️</div>
        <div class="bike bike-4" title="Vikas">🏍️</div>
        <div class="bike bike-5" title="Sandeep">🏍️</div>

        <!-- You -->
        <div class="my-bike">
          🏍️
          <span>YOU</span>
        </div>

      </div>

    </section>


    <!-- Riders -->
    <section class="riders-section">

      <div class="section-header">
        <h2>Riders</h2>
        <span>8 Members</span>
      </div>


      <div class="rider-list">

        <div class="rider">
          <div class="rider-icon">🏍️</div>

          <div class="rider-info">
            <strong>Amit</strong>
            <small>🟢 Online • 42 km/h</small>
          </div>

          <button class="call-btn">📞</button>
        </div>


        <div class="rider">
          <div class="rider-icon">🏍️</div>

          <div class="rider-info">
            <strong>Rahul</strong>
            <small>🟢 Online • 38 km/h</small>
          </div>

          <button class="call-btn">📞</button>
        </div>


        <div class="rider">
          <div class="rider-icon">🏍️</div>

          <div class="rider-info">
            <strong>Ravi</strong>
            <small>🟢 Online • 45 km/h</small>
          </div>

          <button class="call-btn">📞</button>
        </div>


        <div class="rider">
          <div class="rider-icon">🏍️</div>

          <div class="rider-info">
            <strong>Vikas</strong>
            <small>🟢 Online • 41 km/h</small>
          </div>

          <button class="call-btn">📞</button>
        </div>

      </div>

    </section>

  </main>


  <!-- Bottom Navigation -->
  <nav class="bottom-nav">

    <button class="nav-item active">
      <span>🗺️</span>
      <small>Map</small>
    </button>

    <button class="nav-item" id="chatBtn">
      <span>💬</span>
      <small>Chat</small>
    </button>

    <button class="nav-item" id="callBtn">
      <span>📞</span>
      <small>Calls</small>
    </button>

    <button class="nav-item">
      <span>👥</span>
      <small>Riders</small>
    </button>

  </nav>


  <script src="app.js"></script>

</body>
</html>
